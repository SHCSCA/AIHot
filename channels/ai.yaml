id: ai
name: AI 情报
description: AI 模型、产品、Agent、论文、行业和商业化动态
categories:
  - id: ai_models
    label: 模型发布
  - id: ai_products
    label: AI 产品
  - id: agent_tools
    label: Agent / 编程工具
  - id: papers
    label: 论文研究
  - id: industry
    label: 行业动态
  - id: monetization
    label: 赚钱 / 商业化案例
scoring:
  selected_threshold: 75
  weights:
    source_score: 0.20
    relevance_score: 0.20
    impact_score: 0.25
    novelty_score: 0.15
    actionability_score: 0.15
    freshness_score: 0.05
